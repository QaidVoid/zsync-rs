[package]
name = "zsync-rs"
version = "0.3.0"
edition = "2024"
description = "Efficient file transfer using rsync algorithm over HTTP"
license = "MIT"
keywords = ["zsync", "rsync", "http", "file-transfer", "delta"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "zsync"
path = "src/bin/zsync.rs"

[[bin]]
name = "zsyncmake"
path = "src/bin/zsyncmake.rs"

[dependencies]
thiserror = "2.0.21"
md4 = "0.11"
sha1 = "0.11"
ureq = { version = "3.5.0" }
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
